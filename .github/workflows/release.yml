name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # The changelog is generated from commits since the previous tag, so
          # the full history has to be present.
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@624cd6674f8c5c2d4e4204c11ece62a00d7fac0a
        with:
          version: '0.11.184'
          install: 'false'

      - name: Use Cached node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
