name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # So a maintainer can ship without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

      # public/assets/styles and resources/data/race-story.json are generated from
      # resources/ by build:assets and committed. A deploy serves the committed
      # copies, so source that has outrun them ships a page missing its styles,
      # and every local check still passes.
      - name: Generated assets match their source
        run: |
          bun run build:assets
          if ! git diff --quiet; then
            echo "build:assets changed committed files. Run 'bun run build:assets' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      - name: Typecheck
        run: bun buddy test:types

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c1417d98f5613290bc3b1f96d35086b834684659 # v0.10.47 + the socket-hang-up retry fix
        with:
          install: 'false'

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Set Application Key
        run: bun buddy key:generate

      # Feature tests query real tables, and a fresh checkout has no database
      # file at all: it is gitignored, being machine-local state. Without this
      # the suite fails in beforeAll with "no such table", which reads like a
      # broken test rather than a missing schema.
      - name: Migrate the database
        run: bun buddy migrate

      - name: Test Suite
        run: bun run test
