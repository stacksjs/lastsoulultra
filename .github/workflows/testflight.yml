name: TestFlight

# A release is one command, `bun run release:build` (scripts/release-native.ts):
# it pushes a `chore(release): v<version>-build.<n>` commit and its tag. CI runs
# on that push, Deploy follows CI, and this follows Deploy, so the app is only
# ever built once the backend it talks to is live on the same HQ kit. Any other
# commit deploys without uploading an app.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]

  # By hand: rerun an upload that failed for a reason outside the commit, or
  # exercise acceptance without uploading.
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after downloaded-app acceptance passes
        type: boolean
        default: true
      verify_run:
        description: Only re-check TestFlight for the upload of this earlier run (its run id); nothing is built or uploaded
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: lsu-testflight
  cancel-in-progress: false

jobs:
  release:
    # Both events run on main: the signing environment admits no other branch.
    if: >-
      github.ref == 'refs/heads/main' && (
        (github.event_name == 'workflow_dispatch' && inputs.verify_run == '') || (
          github.event.workflow_run.conclusion == 'success' &&
          startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v')
        )
      )
    runs-on: xcode-27
    timeout-minutes: 90
    environment: ios-testflight
    steps:
      - name: Checkout the requested main revision
        uses: actions/checkout@v7
        with:
          # The commit Deploy just put live, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@624cd6674f8c5c2d4e4204c11ece62a00d7fac0a
        with:
          # Qualified native-lock replay, registry integrity and verified retries.
          version: '0.11.184'
          install: 'false'

      - name: Setup the pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Select and verify released Xcode
        run: |
          bun -e 'import { appendFileSync } from "node:fs"; import { releaseXcodeVersion, assertReleaseXcode } from "./scripts/ios-release-toolchain"; const directory=`/Applications/Xcode_${releaseXcodeVersion}.app/Contents/Developer`; const result=Bun.spawnSync(["/usr/bin/xcodebuild","-version"],{env:{...process.env,DEVELOPER_DIR:directory},stdout:"pipe",stderr:"pipe"}); if(result.exitCode)throw Error("The pinned released Xcode is unavailable on this runner"); const version=result.stdout.toString(); assertReleaseXcode(version); appendFileSync(process.env.GITHUB_ENV!,`DEVELOPER_DIR=${directory}\n`); console.log(version);'

      - name: Install the frozen application dependencies
        run: bun install --frozen-lockfile

      - name: Install the pinned native project generator
        run: pantry install --user github.com/yonaskolb/XcodeGen@2.46.0

      - name: Install the pinned HQ platform kit
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_REGISTRY_TOKEN }}
        run: pantry ci

      - name: Build the complete native app from the HQ platform kit
        run: bun run native:ios

      - name: Build the simulator application from the same source
        run: bun scripts/build-native-simulator.ts

      - name: Publish the simulator artifact for acceptance
        uses: actions/upload-artifact@v6
        with:
          name: lsu-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            storage/native/simulator/*/LastSoulUltra-simulator.app.zip
            storage/native/simulator/*/receipt.json

      - name: Download the published application for XCUITest
        uses: actions/download-artifact@v7
        with:
          name: lsu-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/native/downloaded-simulator

      - name: Test the downloaded application against the isolated LSU API
        env:
          LSU_NATIVE_TEST_ACCOUNTS: ${{ secrets.LSU_NATIVE_TEST_ACCOUNTS }}
        run: bun scripts/test-native-ios.ts "storage/native/downloaded-simulator/$(bun -e 'import p from "./native/product.json"; console.log(`${p.version}-${p.build}`)')/LastSoulUltra-simulator.app.zip"

      - name: Save screenshots and redacted acceptance results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lsu-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            storage/native/acceptance/*/lsu-*.png
            storage/native/acceptance/*/lsu-*.txt
            storage/native/acceptance/*/result.json

      - name: Prepare temporary signing material
        if: inputs.upload || github.event_name == 'workflow_run'
        env:
          LSU_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.LSU_IOS_DISTRIBUTION_P12_BASE64 }}
          LSU_IOS_DISTRIBUTION_PASSWORD: ${{ secrets.LSU_IOS_DISTRIBUTION_PASSWORD }}
          LSU_ASC_PRIVATE_KEY_BASE64: ${{ secrets.LSU_ASC_PRIVATE_KEY_BASE64 }}
          LSU_ASC_KEY_ID: ${{ secrets.LSU_ASC_KEY_ID }}
          LSU_ASC_ISSUER_ID: ${{ secrets.LSU_ASC_ISSUER_ID }}
        run: bun scripts/ios-ci-signing.ts stage

      - name: Verify, sign and upload the prepared application
        if: inputs.upload || github.event_name == 'workflow_run'
        run: bun run native:testflight --prepared

      - name: Verify TestFlight processing and internal availability
        if: inputs.upload || github.event_name == 'workflow_run'
        run: bun scripts/verify-native-testflight.ts

      - name: Remove signing files and temporary keychain
        if: always()
        run: bun scripts/ios-ci-signing.ts cleanup

      - name: Save signed app and source receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lsu-ios-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            storage/native/release/*/export/*.ipa
            storage/native/release/*/upload.json
            storage/native/release/*/testflight.json
            storage/framework/mobile/ios/lsu-source.json
            storage/native/bundled-login-report.json

  # Apple accepts an upload and lists the build when it has processed it, which
  # is usually minutes and sometimes longer than the release run waits. The
  # binary is with Apple by then and its build number is spent, so the answer is
  # to ask again, never to upload again: this takes the earlier run's upload
  # receipt and finishes what that run could not (processing, the internal
  # groups, What to Test).
  verify:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.verify_run != ''
    runs-on: xcode-27
    timeout-minutes: 75
    environment: ios-testflight
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@624cd6674f8c5c2d4e4204c11ece62a00d7fac0a
        with:
          version: '0.11.184'
          install: 'false'

      - name: Setup the pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install the frozen application dependencies
        run: bun install --frozen-lockfile

      - name: Install the pinned HQ platform kit
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_REGISTRY_TOKEN }}
        run: pantry ci

      # The App Store Connect client is the kit's own; nothing is compiled.
      - name: Prepare the kit's tools
        run: bun run native:prepare

      - name: Fetch the earlier run's upload receipt
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.verify_run }}
          github-token: ${{ github.token }}
          pattern: lsu-ios-*
          merge-multiple: true
          path: storage/native/verify-download

      - name: Prepare the App Store Connect credential
        env:
          LSU_IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.LSU_IOS_DISTRIBUTION_P12_BASE64 }}
          LSU_IOS_DISTRIBUTION_PASSWORD: ${{ secrets.LSU_IOS_DISTRIBUTION_PASSWORD }}
          LSU_ASC_PRIVATE_KEY_BASE64: ${{ secrets.LSU_ASC_PRIVATE_KEY_BASE64 }}
          LSU_ASC_KEY_ID: ${{ secrets.LSU_ASC_KEY_ID }}
          LSU_ASC_ISSUER_ID: ${{ secrets.LSU_ASC_ISSUER_ID }}
        run: bun scripts/ios-ci-signing.ts stage

      - name: Verify TestFlight processing and internal availability
        run: bun scripts/verify-native-testflight.ts --receipts storage/native/verify-download

      - name: Remove signing files and temporary keychain
        if: always()
        run: bun scripts/ios-ci-signing.ts cleanup
